# 哨兵模板（三条哨兵共用，启动时用 sed 替换 __PORT__）
# E05：docker kill -s KILL arch-redis-master 观察切换耗时与丢写
port __PORT__
dir /tmp

# 监控主库（quorum=2，三条哨兵里要有 2 条同意才判定客观下线）
sentinel monitor mymaster redis-master 6379 2

# 判定主观下线的超时：调小能更快切换，也更容易误判
sentinel down-after-milliseconds mymaster 5000

# 故障转移期间最多几个从库同时同步
sentinel parallel-syncs mymaster 1

# 故障转移超时
sentinel failover-timeout mymaster 60000

# 关键：主库如果长时间没有足够的从库同步，就拒绝写入（减少主从异步复制丢写的窗口）
# 这两行在哨兵模式下不会下发到 Redis，需要直接配在 redis-master 的启动参数里（见 docker-compose.yml）
# min-replicas-to-write 1
# min-replicas-max-lag 10

# 哨兵自身运行在保护模式下不允许外部访问，实验环境关掉
protected-mode no
