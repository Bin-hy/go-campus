<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- Service 转发：客户端 → Service（固定 ClusterIP）→ Endpoints（Pod IP 列表）→ 具体 Pod -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 客户端（灰） -->
  <g filter="url(#shadow)">
    <rect x="20" y="85" width="140" height="70" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="90" y="118" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">客户端</text>
  <text x="90" y="139" font-size="11.5" fill="#495057" text-anchor="middle">调用方</text>

  <!-- Service（绿：稳定入口） -->
  <g filter="url(#shadow)">
    <rect x="210" y="85" width="180" height="70" rx="9" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  </g>
  <text x="300" y="118" font-size="15" font-weight="bold" fill="#0b3d2e" text-anchor="middle">Service</text>
  <text x="300" y="139" font-size="11.5" fill="#495057" text-anchor="middle">固定 ClusterIP</text>

  <!-- Endpoints（黄：中间状态） -->
  <g filter="url(#shadow)">
    <rect x="440" y="85" width="180" height="70" rx="9" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  </g>
  <text x="530" y="118" font-size="15" font-weight="bold" fill="#5c3a00" text-anchor="middle">Endpoints</text>
  <text x="530" y="139" font-size="11.5" fill="#5c3a00" text-anchor="middle">当前 Pod IP 列表</text>

  <!-- Pod A/B/C（蓝：后端实例） -->
  <g filter="url(#shadow)">
    <rect x="680" y="20" width="140" height="70" rx="9" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="750" y="52" font-size="15" font-weight="bold" fill="#1864ab" text-anchor="middle">Pod A</text>
  <text x="750" y="73" font-size="11.5" fill="#495057" text-anchor="middle">10.0.0.1</text>

  <g filter="url(#shadow)">
    <rect x="680" y="95" width="140" height="70" rx="9" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="750" y="127" font-size="15" font-weight="bold" fill="#1864ab" text-anchor="middle">Pod B</text>
  <text x="750" y="148" font-size="11.5" fill="#495057" text-anchor="middle">10.0.0.2</text>

  <g filter="url(#shadow)">
    <rect x="680" y="170" width="140" height="70" rx="9" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="750" y="202" font-size="15" font-weight="bold" fill="#1864ab" text-anchor="middle">Pod C</text>
  <text x="750" y="223" font-size="11.5" fill="#495057" text-anchor="middle">10.0.0.3</text>

  <!-- 连线 -->
  <path d="M 160 120 L 208 120" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 390 120 L 438 120" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 620 100 L 678 55" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 620 120 L 678 120" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 620 140 L 678 185" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
