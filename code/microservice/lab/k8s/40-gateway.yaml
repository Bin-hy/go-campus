apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: microservice-demo
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: gocampus/gateway:dev
          imagePullPolicy: IfNotPresent
          args:
            # 单个名字 → 网关内部走 dns:/// + round_robin
            - "-targets=uservice-headless.microservice-demo.svc.cluster.local:9001"
            - "-http-addr=:8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: microservice-demo
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
