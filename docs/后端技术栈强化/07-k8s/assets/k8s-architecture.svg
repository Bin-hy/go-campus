<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- K8s 集群架构：控制面（决策）+ Node（干活） -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== 控制面 Control Plane ==================== -->
  <rect x="20" y="40" width="520" height="420" rx="14" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  <text x="40" y="74" font-size="17" font-weight="bold" fill="#0b3d2e">控制面 Control Plane · 决策</text>
  <text x="40" y="96" font-size="12" fill="#099268">决策：读账本 → 做决定 → 写回账本</text>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="60" y="116" width="180" height="64" rx="9" fill="#ffffff" stroke="#087f5b" stroke-width="1.5"/>
  </g>
  <text x="150" y="143" font-size="15" font-weight="bold" fill="#0b3d2e" text-anchor="middle">Scheduler</text>
  <text x="150" y="164" font-size="11.5" fill="#495057" text-anchor="middle">调度器 · 给 Pod 找 Node</text>

  <!-- Controller Manager -->
  <g filter="url(#shadow)">
    <rect x="300" y="116" width="200" height="64" rx="9" fill="#ffffff" stroke="#087f5b" stroke-width="1.5"/>
  </g>
  <text x="400" y="143" font-size="15" font-weight="bold" fill="#0b3d2e" text-anchor="middle">Controller Manager</text>
  <text x="400" y="164" font-size="11.5" fill="#495057" text-anchor="middle">控制器 · 盯期望 vs 实际</text>

  <!-- API Server -->
  <g filter="url(#shadow)">
    <rect x="140" y="230" width="280" height="84" rx="10" fill="#ffffff" stroke="#087f5b" stroke-width="2"/>
  </g>
  <text x="280" y="262" font-size="17" font-weight="bold" fill="#0b3d2e" text-anchor="middle">API Server</text>
  <text x="280" y="285" font-size="12" fill="#212529" text-anchor="middle">唯一入口 · 所有请求都过它</text>
  <text x="280" y="301" font-size="11" fill="#868e96" text-anchor="middle">唯一能读写 etcd 的组件</text>

  <!-- etcd（圆柱体，账本） -->
  <g filter="url(#shadow)">
    <path d="M 200 368 L 200 432 A 80 15 0 0 0 360 432 L 360 368 A 80 15 0 0 1 200 368 Z" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  </g>
  <text x="280" y="412" font-size="15" font-weight="bold" fill="#5c3a00" text-anchor="middle">etcd</text>
  <text x="280" y="431" font-size="11" fill="#5c3a00" text-anchor="middle">状态账本 · Raft 强一致</text>

  <!-- 控制面内部连线 -->
  <path d="M 150 180 L 235 230" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 180 L 325 230" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 280 314 L 280 353" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="291" y="338" font-size="11" fill="#868e96">读写</text>

  <!-- ==================== Node 1 ==================== -->
  <rect x="600" y="60" width="330" height="240" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="620" y="88" font-size="15" font-weight="bold" fill="#212529">Node 1 · 干活</text>

  <g filter="url(#shadow)">
    <rect x="625" y="110" width="130" height="64" rx="9" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="690" y="137" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">kubelet</text>
  <text x="690" y="157" font-size="11.5" fill="#495057" text-anchor="middle">驻场管家</text>

  <g filter="url(#shadow)">
    <rect x="775" y="110" width="130" height="64" rx="9" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="840" y="137" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Pod</text>
  <text x="840" y="157" font-size="11.5" fill="#495057" text-anchor="middle">最小调度单位</text>

  <path d="M 755 142 L 775 142" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="765" y="134" font-size="10.5" fill="#868e96" text-anchor="middle">管理</text>

  <!-- ==================== Node 2 ==================== -->
  <rect x="600" y="320" width="330" height="240" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="620" y="348" font-size="15" font-weight="bold" fill="#212529">Node 2 · 干活</text>

  <g filter="url(#shadow)">
    <rect x="625" y="370" width="130" height="64" rx="9" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="690" y="397" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">kubelet</text>
  <text x="690" y="417" font-size="11.5" fill="#495057" text-anchor="middle">驻场管家</text>

  <g filter="url(#shadow)">
    <rect x="775" y="370" width="130" height="64" rx="9" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="840" y="397" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Pod</text>
  <text x="840" y="417" font-size="11.5" fill="#495057" text-anchor="middle">最小调度单位</text>

  <path d="M 755 402 L 775 402" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="765" y="394" font-size="10.5" fill="#868e96" text-anchor="middle">管理</text>

  <!-- ==================== API Server ↔ kubelet 连线 ==================== -->
  <path d="M 420 272 C 500 220, 565 142, 625 142" stroke="#868e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="505" y="196" font-size="11" fill="#868e96">上报 / 指令</text>

  <path d="M 420 272 C 500 330, 565 422, 625 422" stroke="#868e96" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="505" y="365" font-size="11" fill="#868e96">上报 / 指令</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="250" y="602" width="18" height="18" rx="4" fill="#e6fcf5" stroke="#087f5b" stroke-width="1.5"/>
  <text x="276" y="615" font-size="12" fill="#212529">决策（控制面）</text>

  <rect x="400" y="602" width="18" height="18" rx="4" fill="#fff3bf" stroke="#f08c00" stroke-width="1.5"/>
  <text x="426" y="615" font-size="12" fill="#212529">账本（etcd）</text>

  <rect x="540" y="602" width="18" height="18" rx="4" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="566" y="615" font-size="12" fill="#212529">执行（Node）</text>
</svg>
