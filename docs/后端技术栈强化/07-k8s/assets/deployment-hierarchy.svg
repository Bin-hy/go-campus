<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- 控制器层级：Deployment 管 ReplicaSet，ReplicaSet 管 Pod -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Deployment（绿：声明/目标） -->
  <g filter="url(#shadow)">
    <rect x="130" y="30" width="260" height="76" rx="9" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/>
  </g>
  <text x="260" y="68" font-size="15" font-weight="bold" fill="#0b3d2e" text-anchor="middle">Deployment</text>
  <text x="260" y="90" font-size="11.5" fill="#495057" text-anchor="middle">管版本与发布策略</text>

  <!-- ReplicaSet（蓝：动作/中间管理） -->
  <g filter="url(#shadow)">
    <rect x="130" y="170" width="260" height="76" rx="9" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="260" y="208" font-size="15" font-weight="bold" fill="#1864ab" text-anchor="middle">ReplicaSet</text>
  <text x="260" y="230" font-size="11.5" fill="#495057" text-anchor="middle">保证副本数不变</text>

  <!-- Pod 1/2/3（灰：执行单元） -->
  <g filter="url(#shadow)">
    <rect x="30" y="320" width="130" height="76" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="95" y="358" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Pod</text>
  <text x="95" y="380" font-size="11.5" fill="#495057" text-anchor="middle">实例</text>

  <g filter="url(#shadow)">
    <rect x="195" y="320" width="130" height="76" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="260" y="358" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Pod</text>
  <text x="260" y="380" font-size="11.5" fill="#495057" text-anchor="middle">实例</text>

  <g filter="url(#shadow)">
    <rect x="360" y="320" width="130" height="76" rx="9" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  </g>
  <text x="425" y="358" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">Pod</text>
  <text x="425" y="380" font-size="11.5" fill="#495057" text-anchor="middle">实例</text>

  <!-- 连线 -->
  <path d="M 260 106 L 260 168" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 220 246 L 105 318" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 246 L 260 318" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 246 L 415 318" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
