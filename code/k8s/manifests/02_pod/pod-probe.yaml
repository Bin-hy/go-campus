apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  labels:
    app: probe
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      # 就绪探针：/healthz 返回 200 才算"可以接流量"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      # 存活探针：/healthz 连续失败 3 次 → 重启容器
      livenessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
      # 启动探针：给慢启动应用 30 秒，期间不执行存活探针
      startupProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 1
        periodSeconds: 2
        failureThreshold: 15
