# 普通 ClusterIP：给网关/其他服务按"服务名"访问（K8s 自带 L4 负载均衡）。
apiVersion: v1
kind: Service
metadata:
  name: uservice
  namespace: microservice-demo
  labels:
    app: uservice
spec:
  type: ClusterIP
  selector:
    app: uservice
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
---
# Headless Service：DNS 直接返回所有 Pod IP，
# 客户端用 dns:///uservice-headless... + round_robin 实现"客户端负载均衡"。
apiVersion: v1
kind: Service
metadata:
  name: uservice-headless
  namespace: microservice-demo
  labels:
    app: uservice
spec:
  clusterIP: None
  selector:
    app: uservice
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
